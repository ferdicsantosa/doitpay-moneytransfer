server:
  port: "8080"

database:
  dsn: "postgres://postgres:postgres@postgres:5432/doitpay_transfer?sslmode=disable"
  max_open_conns: 25
  max_idle_conns: 10

nsq:
  nsqd_tcp_addr: "nsqd:4150"
  topic: "disbursement.process"
  channel: "disbursement_worker"
  max_attempts: 3
  concurrency: 5
  requeue_delay_seconds: 2
  max_requeue_delay_seconds: 10
  msg_timeout_seconds: 60

redis:
  addr: "redis:6379"
  lock_ttl_seconds: 30
  idempotency_ttl_seconds: 300
